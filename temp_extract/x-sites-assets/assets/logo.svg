<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg" width="200" height="60">
  <!-- X in bold blue (diagonal lines) -->
  <g stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="8" y1="12" x2="32" y2="48"/>
    <line x1="32" y1="12" x2="8" y2="48"/>
  </g>
  
  <!-- Simple text representation using basic shapes -->
  <!-- Letter "S" -->
  <path d="M 50 20 L 65 20 Q 68 20 68 23 L 68 25 Q 68 28 65 28 L 50 28 Q 53 28 53 31 L 53 33 Q 53 36 56 36 L 71 36" stroke="#111827" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter "i" dot and line -->
  <circle cx="77" cy="18" r="1.5" fill="#111827"/>
  <line x1="77" y1="23" x2="77" y2="35" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Letter "t" -->
  <line x1="85" y1="14" x2="85" y2="34" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="19" x2="90" y2="19" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Letter "e" -->
  <path d="M 103 28 L 112 28 M 103 30 L 112 30" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <path d="M 115 20 Q 115 26 105 26 Q 100 26 100 30 Q 100 34 105 34 Q 115 34 115 28" stroke="#111827" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter "s" -->
  <path d="M 130 22 L 125 22 Q 122 22 122 25 Q 122 27 125 27 L 130 27 Q 133 27 133 30 Q 133 33 130 33 L 125 33" stroke="#111827" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Accent line -->
  <line x1="50" y1="45" x2="140" y2="45" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
</svg>
